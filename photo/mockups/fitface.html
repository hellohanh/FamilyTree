const $=i=>document.getElementById(i),S=300,ph=$('ph');let sex='F',guides=true,px=0,py=0,img=new Image();
function load(){img=new Image();img.onload=()=>{ph.src=img.src;draw()};img.src=SRC[sex]}
function v(i){return +$(i).value}
function draw(){const z=v('z')/100,w=S*z;px=Math.min(0,Math.max(S-w,px));py=Math.min(0,Math.max(S-w,py));
 ph.style.width=w+'px';ph.style.height=w+'px';ph.style.transform=`translate(${px}px,${py}px)`;
 const cx=150,cy=v('oy')/100*S,rx=v('ow')/200*S,ry=v('oh')/200*S;
 const o=$('ov');o.setAttribute('cx',cx);o.setAttribute('cy',cy);o.setAttribute('rx',rx);o.setAttribute('ry',ry);
 const ny=v('ny')/100*S,nw=v('nw')/100*S,nc=v('nc')/100*S;
 $('neck').setAttribute('d',`M${150-nw/2},${ny} Q150,${ny-nc*2} ${150+nw/2},${ny}`);
 $('shade').setAttribute('d',`M0,0H300V300H0Z M${cx-rx},${cy} a${rx},${ry} 0 1,0 ${2*rx},0 a${rx},${ry} 0 1,0 ${-2*rx},0Z`);
 $('shade').setAttribute('fill',`rgba(0,0,0,${v('sh')/100})`);
 $('g').style.display=guides?'':'none';
 [['vow',v('ow')+'%'],['voh',v('oh')+'%'],['voy',v('oy')+'%'],['vsh',v('sh')+'%'],['vny',v('ny')+'%'],['vnw',v('nw')+'%'],['vnc',v('nc')],['vz',v('z')+'%']].forEach(([i,t])=>$(i).textContent=t);
 for(const c of [$('c48'),$('c72')]){const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const k=c.width/S;x.drawImage(img,px*k,py*k,w*k,w*k)}
 $('out').textContent=`oval: width ${v('ow')}%, height ${v('oh')}%, centre ${v('oy')}% from top, shade ${v('sh')}%\nneck line: ${v('ny')}% from top, width ${v('nw')}%, curve ${v('nc')}`}
document.querySelectorAll('input').forEach(i=>i.addEventListener('input',draw));
$('bF').onclick=()=>{sex='F';$('bF').classList.add('on');$('bM').classList.remove('on');load()};
$('bM').onclick=()=>{sex='M';$('bM').classList.add('on');$('bF').classList.remove('on');load()};
$('bG').onclick=()=>{guides=!guides;$('bG').classList.toggle('on',guides);$('bG').textContent=guides?'Guides on':'Guides off';draw()};
let d=null;const cr=$('crop');
cr.addEventListener('pointerdown',e=>{d={x:e.clientX-px,y:e.clientY-py};cr.setPointerCapture(e.pointerId)});
cr.addEventListener('pointermove',e=>{if(d){px=e.clientX-d.x;py=e.clientY-d.y;draw()}});
cr.addEventListener('pointerup',()=>d=null);
load();
</script></body></html>
