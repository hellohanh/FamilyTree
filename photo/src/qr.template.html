<div class="tools"><h1>QR card for the picture page</h1>
 <p>Type the family code, then print. The code only goes on the printout; it isn't saved anywhere.</p>
 <label for="c">Family code</label><div class="row"><input id="c" maxlength="20" autocomplete="off" spellcheck="false"><button type="button" onclick="print()">Print</button></div></div>
<div class="sheet" id="sheet"></div>
<template id="tpl"><div class="card"><div class="t"><span>Tr</span>ancestry</div><div class="s">Add a picture to the family tree</div>__QR__
 <div class="code">Family code<b class="cv"></b></div><div class="u">hellohanh.github.io/FamilyTree/photo</div></div></template>
<script>
const sheet=document.getElementById('sheet'),tpl=document.getElementById('tpl');for(let i=0;i<4;i++)sheet.appendChild(tpl.content.cloneNode(true));
const c=document.getElementById('c');c.addEventListener('input',()=>document.querySelectorAll('.cv').forEach(b=>b.textContent=c.value.trim().toUpperCase()));
</script></body></html>
