<style>
__FONTS__
/* Background: IBM Carbon g100 (Gray 100) — LOCKED by Hanh, Entry 4.
   Only backgrounds / layers / borders / text greys are Carbon so far; ♂/♀ and accent colours unchanged. */
:root, :root[data-bg="g100"]{
  --paper:#161616; --paper2:#262626; --card:#262626; --line:#525252;
  --ink:#f4f4f4; --muted:#c6c6c6; --m:#78a9ff; --f:#ee5396; --accent:#f0bc4f;
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"HFT Segoe","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;overflow:hidden}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--paper2);position:relative;z-index:2}
h1{font-family:"HFT Segoe","Segoe UI",system-ui,-apple-system,"Noto Sans",sans-serif;font-weight:600;font-size:22px;margin:0}
h1 small{display:block;font-family:"HFT Segoe","Segoe UI",system-ui,sans-serif;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.2px;margin-top:1px}
select,button.back{font:inherit;font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.back{display:none;align-items:center;gap:6px}
body.focus button.back{display:inline-flex}
.crumb{font-size:13px;color:var(--muted)} .crumb b{color:var(--ink);font-weight:600}
.legend{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:14px;align-items:center}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
img.w{height:14px;vertical-align:middle;margin-right:3px}
/* Hanh's angel-wing art, recoloured black → marigold #F0BC4F on transparent (Entry 6) */
#stage{position:absolute;top:var(--hh,60px);left:var(--lw,0px);right:0;bottom:0}
/* Entry 21: Vietnamese generation labels, one line pinned along the top of the focus view */
#band{position:absolute;top:var(--hh,60px);left:var(--lw,0px);right:0;height:40px;background:none;border:0;z-index:2;display:none;overflow:hidden;pointer-events:none}
body.focus #band{display:block}
body.focus.topv #band{left:auto;right:0;bottom:0;height:auto;width:var(--bw)}
:root{--bw:150px} @media (max-width:820px){:root{--bw:92px} body.topv #band span{left:calc(50% - 6px);width:calc(var(--bw) - 24px)}}   /* clear of the mustard handle */
body.topv #band span{left:50%;width:calc(var(--bw) - 12px);white-space:normal;text-align:center;line-height:1.15}
#dust{position:absolute;top:var(--hh,60px);left:var(--lw,0px);right:0;bottom:0;pointer-events:none;overflow:hidden;z-index:3}
#dust i{position:absolute;border-radius:50%;background:#b9ad98}
#band span{position:absolute;top:20px;transform:translate(-50%,-50%);white-space:nowrap;font-size:18px;line-height:1.2;color:var(--muted);letter-spacing:.3px}
#band span.me{color:var(--accent);font-weight:700}
/* Entry 42 (Hanh): when the focus label is too wide, blood relative on line 1, spouse(s) on line 2 */
#band span i{font-style:normal}
#band span.two{line-height:1.05;text-align:center}
#band span.two i.a,#band span.two i.b{display:block}
#band span.two i.s{display:none}
#band span.two i.b{font-size:.78em;font-weight:600;opacity:.9}
svg{width:100%;height:100%;display:block;cursor:grab}
path.node{cursor:pointer;stroke-linejoin:round}
.arclabel{pointer-events:none}   /* size comes from each label (Entry 50: a 9.5px rule here was overriding it) */
.card text{fill:var(--ink);pointer-events:none}
.card .M{fill:var(--m)} .card .F{fill:var(--f)} .card .U{fill:var(--muted)}
.card .unk{fill:var(--muted);font-style:italic}
.card .note{fill:var(--accent);font-style:italic}
.card .meta{fill:var(--muted)}
.link{fill:none;stroke:var(--line);stroke-width:1.5}
.lvl{font-size:12px;fill:var(--muted);letter-spacing:.6px;text-transform:uppercase}
.fab{position:fixed;right:16px;bottom:16px;z-index:5;width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--paper2);color:var(--ink);

.fab[aria-pressed="true"]{background:var(--accent);color:#161616;border-color:var(--accent)}

  border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.5)}

body.snap:not(.focus) .hint{display:none}

#genNav .fab:disabled{opacity:.3;cursor:default}
#genLbl{min-width:104px;text-align:center;line-height:1.15}#genLbl b{display:block;font-size:15px;color:var(--accent)}#genLbl small{font-size:11px;color:var(--muted)}
@media (max-width:820px){ body.snap:not(.focus) #genNav{left:16px;transform:none} }
#toast{white-space:nowrap;position:fixed;left:calc(50% + var(--lw,0px)/2);top:calc(var(--hh,60px) + 52px);transform:translateX(-50%);z-index:40;background:var(--ink);color:#161616;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s}

.card .kin{fill:var(--accent);font-weight:700}
.eye{cursor:pointer;pointer-events:all}.eye:hover rect.hit{fill:rgba(240,188,79,.14)}
.pencil{cursor:pointer;pointer-events:all}.pencil:hover rect.hit{fill:rgba(240,188,79,.14)}

.mdl .chip.sel{background:var(--ink);color:#161616;border-color:var(--ink)} .mdl .chip[data-g]{font-size:18px;font-weight:700;padding:1px 12px} .mdl .chip.sel[data-g]{background:#393939;border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor} .mdl .chip:disabled{opacity:.35;cursor:not-allowed}
.mdl .row{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid #393939;border-radius:8px;background:#1e1e1e;font-size:14px}

.mdl label.f{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}

.mdl .ord{width:22px;color:#8d8d8d;font-size:12px;text-align:right}
.mdl .btn{font:inherit;font-size:14px;padding:7px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.mdl .btn.pri{background:var(--ink);color:#161616;border-color:var(--ink)}
@media (max-width:820px){header{padding:10px 16px}.legend{display:none}h1{font-size:19px}}
/* Entry 68 (Hanh): every chip lives in a left panel; the top bar keeps the title and the "Focused on" note.
   Computers: the panel is always there. Phones: it slides in from the left with ☰ (Entry 38's menu, now a drawer). */
.ctrls{display:flex;flex-direction:column;align-items:stretch;gap:8px;position:fixed;top:var(--hh,60px);left:0;bottom:0;width:var(--lw,220px);box-sizing:border-box;
  padding:14px 12px;background:var(--paper2);border-right:1px solid var(--line);overflow-y:auto;z-index:6}
.ctrls select,.ctrls button.back{width:100%;justify-content:flex-start;border-radius:10px;padding:9px 12px;text-align:left}
.ctrls .ptitle{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin:2px 2px 0}
:root{--lw:220px}
/* Entry 69 (Hanh): phones open the panel from a mustard handle on the RIGHT edge — the same handle as the TNCFL
   tracker (Entry 357 there): tap it or swipe left on it; swipe right, tap outside or Esc to close. Replaces ☰. */
#tdw-handle,#tdw-scrim,.ctrls .tdw-hint{display:none}
@media (max-width:820px){
  :root{--lw:0px}
  header .crumb{width:100%;font-size:12.5px} header .crumb:empty{display:none}
  #tdw-handle{display:flex;position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:9;width:22px;height:84px;padding-left:4px;box-sizing:border-box;
    align-items:center;justify-content:center;background:transparent;touch-action:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
  #tdw-handle .tdw-pill{width:10px;height:72px;border-radius:8px 0 0 8px;background:#D9A521;box-shadow:-2px 0 10px rgba(217,165,33,.45);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  #tdw-handle .tdw-pill i{display:block;width:4px;height:4px;border-radius:50%;background:rgba(0,0,0,.55)}
  #tdw-scrim{display:block;position:fixed;inset:0;z-index:41;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s}
  .ctrls{top:0;left:auto;right:0;width:min(250px,72vw);padding:0 14px 14px;border-right:0;border-left:3px solid #D9A521;box-shadow:-8px 0 24px rgba(0,0,0,.6);
    transform:translateX(105%);transition:transform .22s ease;touch-action:pan-y;z-index:42}
  .ctrls .ptitle{padding:18px 4px 4px;margin:0;font-size:11px;font-weight:700;letter-spacing:.12em;color:#D9A521}
  .ctrls .tdw-hint{display:block;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted);opacity:.8}
  body.tdw-open #tdw-scrim{opacity:1;pointer-events:auto}
  body.tdw-open .ctrls{transform:translateX(0)}
  body.tdw-dragging .ctrls,body.tdw-dragging #tdw-scrim{transition:none}
  .ctrls select,.ctrls button.back{min-height:44px;font-size:15px;padding:10px 14px}
}
@media (prefers-reduced-motion: reduce){:root{--motion:0}}

/* Entry 32 (Hanh): intro splash = one of Hanh's two red maple trees (random each visit), held 3 s, then fades to the Paternal sunburst */
#intro{position:fixed;inset:0;z-index:50;background:#161616;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:opacity var(--introFade,.5s) ease}
#intro img{width:min(88vw,88vh);height:min(88vw,88vh);object-fit:contain}   /* cut-out trees, no glow, on the site charcoal */
#intro.out{opacity:0;pointer-events:none}

<script>
const DATA = __DATA__, WINGS = "__WINGS__";
// ---- shared people across sheets (Entry 20 confirmed by Hanh; Entry 26 uses it) ----
// Anchor boxes (first-listed person's name cell) that are the SAME couple on several sheets. Everyone listed under
// them is matched too, box by box, by the blood relative's name (all confirmed by Hanh: "Yes, all of them").
const SHARED_ANCHORS=[
  [['H.HN.T Paternal Tree','W236'],['H.HN.T Maternal Tree','N165']],                       // Hậu & Thường
  [['H.HN.T Paternal Tree','AF241'],['H.HN.T Maternal Tree','W170'],["Huong's Paternal Tree",'W233'],["Huong's Maternal Tree",'W95']],  // Hạnh & Hương
  [["Huong's Paternal Tree",'N228'],["Huong's Maternal Tree",'N90']]                       // Hoạc & Thọ
];
(function linkShared(){
  const par={}, find=x=>par[x]===x?x:(par[x]=find(par[x])), uni=(a,b)=>{par[find(a)]=find(b)};
  const boxes={};
  Object.entries(DATA).forEach(([s,v])=>{ (function w(b){ b.members.forEach(m=>{m.uid=s+'!'+m.cell; par[m.uid]=m.uid}); boxes[s+'!'+b.members[0].cell]=b; (b.children||[]).forEach(w) })({members:[{cell:'_root'}],children:v.roots}) });
  const key=m=>(m.name||'').trim();
  function match(a,b){ a.members.forEach(ma=>{ const mb=b.members.find(x=>key(x)===key(ma)); if(mb) uni(ma.uid,mb.uid) });
    (a.children||[]).forEach(ca=>{ const cb=(b.children||[]).find(x=>key(x.members[0])===key(ca.members[0])); if(cb) match(ca,cb) }) }
  SHARED_ANCHORS.forEach(g=>{ const bs=g.map(([s,c])=>boxes[s+'!'+c]).filter(Boolean); for(let i=1;i<bs.length;i++) match(bs[0],bs[i]) });
  Object.values(DATA).forEach(v=>{ (function w(b){ b.members.forEach(m=>m.pid=find(m.uid)); (b.children||[]).forEach(w) })({members:[],children:v.roots}) });
})();
function allCopies(m){ const out=[]; Object.values(DATA).forEach(v=>{ (function w(b){ b.members.forEach(x=>{ if(x.pid===m.pid) out.push(x) }); (b.children||[]).forEach(w) })({members:[],children:v.roots}) }); return out }
// Timing (Entry 10) — locked defaults; URL ?dur=&cs=&ce= kept for testing only (panel removed, Entry 11)
const _q=new URLSearchParams(location.search);
let DUR = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : +(_q.get('dur')||2000);  // LOCKED 2.0 s (Hanh, Entry 10)
let COLOR_START = +(_q.get('cs')||0)/100;   // colour change starts at this fraction of the morph
let COLOR_END   = +(_q.get('ce')||65)/100;  // LOCKED 0% → 65%  // …and is fully the top-down colour by this fraction
// Hanh's spec (Entry 3): size / opacity by level relative to the clicked couple
const LV = {"-2":{s:.25,o:.25,name:"Grandparents"},"-1":{s:.5,o:.5,name:"Parents"},"0":{s:1,o:1,name:""},
            "1":{s:.75,o:1,name:"Children"},"2":{s:.5,o:1,name:"Grandchildren"},"3":{s:.3,o:1,name:"Great-grandchildren"}};
// Entry 20 (Hanh): show ALL generations below; each one beyond great-grandchildren is 5 points smaller (25%, 20%, …, floor 5%).
for(let l=4;l<=12;l++) LV[l]={s:Math.max(.05,.30-.05*(l-3)),o:1,name:(l===4?'Great-great':(l-2)+'× great')+'-grandchildren'};
// Entry 43 (Hanh): the viewed person's whole line of ancestors can show; beyond grandparents same look as grandparents.
for(let l=-3;l>=-12;l--) LV[l]={s:.25,o:.25,name:'Ancestors'};
const LV_BASE={}; for(let l=-1;l>=-12;l--) LV_BASE[l]=LV[l];
// Entry 13: spouses are separate person cards side by side. PW = one person card, SG = gap between spouses,
// GAPX = gap between sibling groups (kept clearly wider than SG so couples read as couples).
const CW=230, PW=230, SG=28,  // spouse gap doubled 14 → 28 (Hanh, Entry 15)
     _unused=0, LH=36, PADY=12, GAPX=100, GAPY=70,  // gap between sibling families 44 → 100 (Hanh, Entry 15)
      RING0=110;
let SNAPPX=16;   // Entry 54
let LBL=new URLSearchParams(location.search).get('lbl')||'auto', SCREENPX=14, LBLT=null;   // Entry 56: 'auto' = computers use 'screen', phones 'fixed'
// Entry 62: 'computer' = a mouse/trackpad (fine pointer) AND a wide screen. A phone turned sideways is wider than
// 820 px but still a touch screen, so it keeps the phone behaviour (it used to switch to the computer layout).
const DESK=()=>innerWidth>820&&!matchMedia('(pointer: coarse)').matches;

    if(up===4) return (M?'Ông Kỵ ':F?'Bà Kỵ ':'')+side;   // Entry 43 (Hanh): great-great-grandparents = Ông Kỵ / Bà Kỵ
    return '';
  }
  // Entry 24 (Hanh): same generation and below, for EVERY line (own, siblings, cousins, second cousins…).
  // Spouses of these blood relatives get the matching Rể (husband) / Dâu (wife) title.
  const gen=down-up;
  if(gen===0){                                    // siblings, cousins…: Anh/Chị/Em by the branch order at the shared box
    const o=sib()==='older';
    if(!spouse) return o?(M?'Anh':F?'Chị':''):'Em';
    return o?(bM?'Chị Dâu':'Anh Rể'):(bM?'Em Dâu':'Em Rể');
  }
  if(gen>0){                                      // descendants of any line: Con (own) / Cháu / Cháu / Chắt / Chút / Chít
    const base=(up===0&&gen===1)?'Con':(['','Cháu','Cháu','Chắt','Chút','Chít'][gen]||'');
    if(!base) return '';
    return spouse?(base+(M?' Rể':F?' Dâu':'')):base;
  }
  // Entry 25 (Hanh): one generation above — parents' siblings AND parents' cousins (any depth) — Bác if their branch
  // is older at the shared box, else Chú/Cô (Nội) or Cậu/Dì (Ngoại); spouses Bác / Thím, Dượng / Mợ, Dượng.
  // Entries 25/27 (Hanh): uncle/aunt words for the parents' AND grandparents' generations (siblings + cousins).
  // SIDE comes from the viewpoint's own blood parent (gen −1) / that parent's blood parent (gen −2) — Entry 39:
  //   a man → father's-side words: Bác (their branch older) else Chú / Thím, O / Dượng (Entry 37: Hanh says O, not Cô; O's husband = Dượng);
  //   a woman → mother's-side words, any age: Cậu / Mợ, Dì / Dượng.
  // Grandparents' generation = Ông/Bà + the same word (Ông Dượng Hạnh, Bà O Hương, Bà Thím Bomp).
  if(gen===-1||gen===-2){
    // Entry 39 (Hanh): the side comes from the viewpoint's OWN blood relative, not the split point: one generation up
    // → the viewer's blood parent (father → Bác/Chú/O, mother → Cậu/Dì); two up → Ông/Bà + what that parent calls
    // them, i.e. the side of the parent's own blood parent. Older/younger still comes from the branch order at the split.
    const head=(gen===-1?nv.parent:nv.parent.parent).data.members[0], paternal=head.gender==='M';
    let w;
    if(!paternal) w=spouse?(bM?'Mợ':'Dượng'):(bM?'Cậu':'Dì');
    else if(sib()==='older') w='Bác';
    else w=spouse?(bM?'Thím':'Dượng'):(bM?'Chú':(CENTRAL?'O':'Cô'));   // Entry 37 (Hanh): Dad's younger sister = O (Hanh's family word; Central term, = Cô); her husband = Dượng (Southern chart, was Chú)
    if(gen===-1) return w;
    return (M?'Ông ':F?'Bà ':'')+w;
  }
  if(gen===-3) return (M?'Ông Cố':F?'Bà Cố':'');  // great-grandparents' siblings and cousins
  return '';
}

// Connector bus is set per generation, not per card (Hanh, Entry 8): every horizontal line between two

function busY(Y,maxH,l){return ((Y[l-1]+maxH[l-1]/2)+(Y[l]-maxH[l]/2))/2}
// A couple's line to their children drops from between the two cards (the spouse link); singles and 3-person groups drop from the bottom.
// Entry 14 (Hanh): the first-listed person in each box is the blood relative, so a parent's line lands on
// that person's own card, not between a married child and their spouse.
function linkPath(a,b,by,m,mc,phc,pd,cd){
  if(SIDE){ // out of the parent group's right edge, along the generation bus, into the blood relative's left edge
    const s=LV[b.l].s, x1=a.x+a.w/2, x2=b.x-b.w/2, y2=mc>1?b.y-b.h/2+(SLOT(cd,0)*(phc+SG)+phc/2)*s:b.y;
    let y1=a.y;
    if(pd&&twoWives(pd)&&cd.mother){ const sp=LV[a.l].s, ph=cardH(pd), mi=pd.members.findIndex(x=>x.cell===cd.mother), k=SLOT(pd,mi);   // Entry 30: from between the husband and this child's mother
      y1=a.y-a.h/2+((k<1?0:1)*(ph+SG)+ph+SG/2)*sp }
    return `M${x1},${y1}H${by}V${y2}H${x2}`}
  const y1=m===2?a.y:a.y+a.h/2,y2=b.y-b.h/2;
  const bx=mc>1?b.x-b.w/2+(SLOT(cd,0)*(PWb(cd)+SG)+PWb(cd)/2)*LV[b.l].s:b.x;   // Entry 71: the blood relative's card (real width)
  return `M${a.x},${y1}V${by}H${bx}V${y2}`}

// ---- Vietnamese generation names (Entry 21) ----
// Below: Con · Cháu · Chắt · Chút · Chít (Hanh's family's order). Above: Cha mẹ, then Ông bà nội / ngoại —
// nội if the focused person's blood-relative parent is their father, ngoại if their mother.
const DOWN_VN=['','Con','Cháu','Chắt','Chút','Chít'];
let BANDCOLS=[];
function genName(l,f){
  if(l===0) return f.data.members.map(m=>primaryName(m)).join(' & ');   // band: main name only, no alternative (Entry 30)
  if(l>0) return DOWN_VN[l]||('Đời Thứ '+(l+1));
  if(l===-1) return 'Cha Mẹ';                       // formal capitalization (Hanh, Entry 21)
  const par=f.parent, g=par&&par.data.members[0]&&par.data.members[0].gender;
  const side=g==='M'?' Nội':g==='F'?' Ngoại':'';
  return l===-2?'Ông Bà'+side:'Cụ'+side;
}

// Band seen from the viewpoint (Entry 23, Hanh): each column is named by its generation relative to VIEW.
function genNameV(l,f,pos){
  const V=MEMBER_NODE.get(VIEW); if(!V) return genName(l,f);
  const nv=V.n, diff=(f.depth+l)-nv.depth, anc=new Set(nv.ancestors());
  const col=[]; pos.forEach((p,id)=>{ if(p.l===l) col.push(nodes[id]) });
  const pn=nv.parent, side=pn&&pn.data.members[0].gender==='M'?'Nội':pn&&pn.data.members[0].gender==='F'?'Ngoại':'';
  if(diff===-1) return col.some(n=>n===pn)?'Ba Má':(side==='Ngoại'?'Cậu Dì':(CENTRAL?'Bác Chú O':'Bác Chú Cô'));
  if(diff===-2) return 'Ông Bà '+side;
  if(diff===-3) return 'Ông Bà Cố '+side;
  if(diff===-4) return 'Ông Bà Kỵ '+side;
  if(diff<-3) return '';
  if(diff===0) return 'Anh Chị Em';
  if(diff===1) return col.some(n=>n.parent===nv)?'Con':'Cháu';
  return ['','','Cháu','Chắt','Chút','Chít'][diff]||('Đời Thứ '+(diff+1));
}
function bandHTML(c,f){   // the focus label without a viewpoint is the couple's names: split into blood / spouses
  const ms=f.data.members;
  if(c.l!==0||VIEW||ms.length<2) return esc(c.t);
  const nm1=m=>primaryName(m);
  return `<i class="a">${esc(nm1(ms[0]))}</i><i class="s"> &amp; </i><i class="b">${esc(ms.slice(1).map(nm1).join(' & '))}</i>` }
function placeBand(T){ const band=document.getElementById('band'); if(!band||!BANDCOLS.length) return;
  const sp=[...band.children];
  if(!SIDE){ sp.forEach((s,i)=>{ s.style.top=T.applyY(BANDCOLS[i].x)+'px'; s.style.left='' });   // Entry 70: top view — names on the right, at each row
    const me=sp[BANDCOLS.findIndex(c=>c.l===0)]; if(me&&me.querySelector('i.b')) me.classList.add('two'); return }
  sp.forEach((s,i)=>{ s.style.left=T.applyX(BANDCOLS[i].x)+'px'; s.style.top='' });
  // Entry 42: does the focus label fit between its neighbours? If not, two lines.
  const i=BANDCOLS.findIndex(c=>c.l===0), me=sp[i]; if(!me||!me.querySelector('i.b')) return;
  me.classList.remove('two');
  const x=T.applyX(BANDCOLS[i].x), half=me.offsetWidth/2, gap=12;
  const room=[sp[i-1],sp[i+1]].filter(Boolean).map(n=>Math.abs(T.applyX(BANDCOLS[sp.indexOf(n)].x)-x)-n.offsetWidth/2-gap);
  if(room.some(r=>half>r)) me.classList.add('two') }
function colorFade(el,toFill,toStroke){
  const f0=el.attr('fill'), s0=el.attr('stroke');

}

// Entry 69: phones — options drawer on the right, opened from the mustard handle (TNCFL tracker's handle and swipe rules).
// Picking an option still closes it (Entry 38).
(function(){ const body=document.body, panel=$id('ctrls'), scrim=$id('tdw-scrim'), handle=$id('tdw-handle'), PH=()=>matchMedia('(max-width:820px)').matches;
  const open=()=>{ body.classList.add('tdw-open'); panel.style.transform=''; scrim.style.opacity='' };
  const close=()=>{ body.classList.remove('tdw-open'); panel.style.transform=''; scrim.style.opacity='' };
  const W=()=>panel.getBoundingClientRect().width;
  function drag(x0,fromOpen){ const t0=Date.now(); let dx=0; body.classList.add('tdw-dragging');
    return { move(x){ dx=x-x0; const w=W(), off=fromOpen?Math.max(0,Math.min(w,dx)):Math.max(0,Math.min(w,w+dx));
               panel.style.transform='translateX('+off+'px)'; scrim.style.opacity=String(1-off/w); scrim.style.pointerEvents='none' },
             end(){ body.classList.remove('tdw-dragging'); scrim.style.pointerEvents=''; const w=W(), v=dx/Math.max(1,Date.now()-t0);
               (fromOpen?!(dx>w*.3||v>.5):(dx<-w*.3||v<-.5))?open():close() } } }
  let d=null;
  handle.addEventListener('touchstart',e=>{ d=drag(e.touches[0].clientX,false); d.moved=false },{passive:true});
  handle.addEventListener('touchmove',e=>{ if(d){ d.moved=true; d.move(e.touches[0].clientX); e.preventDefault() } },{passive:false});
  handle.addEventListener('touchend',e=>{ if(d){ d.moved?d.end():(body.classList.remove('tdw-dragging'),open()); d=null; e.preventDefault() } });
  handle.addEventListener('click',()=>{ if(!body.classList.contains('tdw-open')) open() });
  panel.addEventListener('touchstart',e=>{ if(!PH()) return; d=drag(e.touches[0].clientX,true); d.moved=false },{passive:true});
  panel.addEventListener('touchmove',e=>{ if(d){ d.moved=true; d.move(e.touches[0].clientX) } },{passive:true});
  panel.addEventListener('touchend',()=>{ if(d){ d.moved?d.end():body.classList.remove('tdw-dragging'); d=null } });
  scrim.addEventListener('click',close);
  panel.addEventListener('click',e=>{ if(PH()&&e.target.closest('button')) setTimeout(close,120) });
  $id('sheet').addEventListener('change',()=>{ if(PH()) close() });
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&body.classList.contains('tdw-open')){ close(); e.stopImmediatePropagation() } },true);
})();

// Entry 41 (Hanh): Back goes to the previous view inside the site (couple → couple before → … → the sunburst).
// On the sunburst, Back must then be pressed 3 times in a row (within 3 s) to leave; a toast counts down.
// History: [page] [guard g1] [guard g2 = sunburst] [view] [view] … Guards are added after the first tap/key
// (browsers skip history entries added before the visitor interacts). Views are {hft:'f'|'s', sheet, key}.
const nodeKey=d=>{const m=d.data.members[0]; return m.cell||m.name};
let HARMED=false;
function histPush(st){ if(HARMED) history.pushState(st,'') }
function goFocus(d){ focus(d); histPush({hft:'f',sheet:sel.value,key:nodeKey(d)}) }
function goSun(){ if(mode!=='focus') return; unfocus(); histPush({hft:'s',sheet:sel.value}) }
(function(){ let timer=null, tt=null;
  const toast=t=>{ const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),1800) };
  const guards=()=>{ const g=history.state&&history.state.hft==='g'?history.state.n:0; for(let n=g+1;n<=2;n++) history.pushState({hft:'g',n},'') };
  const first=()=>{ if(HARMED) return; HARMED=true; guards() };
  addEventListener('pointerdown',first,{capture:true}); addEventListener('keydown',first,{capture:true});
  const show=st=>{   // bring the page to the view stored in a history entry
    if(busy){ setTimeout(()=>show(st),250); return }
    if(st&&st.sheet&&st.sheet!==sel.value){ sel.value=st.sheet; build(); snapUI() }
    if(st&&st.hft==='f'){ const n=nodes.find(d=>nodeKey(d)===st.key); if(n&&n!==focusNode) focus(n); return }
    if(mode==='focus') unfocus() };
  addEventListener('popstate',e=>{ if(!HARMED) return; const st=e.state; clearTimeout(timer);
    if(st&&(st.hft==='f'||st.hft==='s')){ show(st); return }
    if(st&&st.hft==='g'&&st.n===2){ show(null); return }            // back on the base sunburst
    show(null);                                                        // g1 or the page's own entry: counting down
    toast(st&&st.hft==='g'?'Press Back 2 more times to leave':'Press Back once more to leave');
    timer=setTimeout(guards,3000) });
})();

  document.body.classList.toggle('topv',!SIDE); document.getElementById('band').innerHTML=''; if(mode==='focus'&&focusNode) refreshAndFocus(focusNode.data) };

document.body.classList.toggle('topv',!SIDE);
// ---- Entry 67 (Hanh): stone-slab drop between family views ----
// Oldest generation lands first, then a domino across each row (top view: left → right; side view: top → bottom).
// Each card falls, squashes on impact and kicks up a puff of dust; each generation's lines draw in once it has landed.
let SLABNEXT=false, SLABT=[];
function slabDust(x,y,w){ const L=$id('dust'), n=Math.round(Math.min(26,Math.max(10,w/6)));
  for(let i=0;i<n;i++){ const p=document.createElement('i'), z=2+Math.random()*3.5, px=x+Math.random()*w, side=px<x+w/2?-1:1;
    p.style.cssText=`width:${z}px;height:${z}px;left:${px}px;top:${y-2}px`; L.appendChild(p);
    const dx=side*(16+Math.random()*48), dy=-(4+Math.random()*24);
    p.animate([{transform:'translate(0,0)',opacity:.9},{transform:`translate(${dx}px,${dy}px)`,opacity:.5,offset:.5},{transform:`translate(${dx*1.3}px,${dy+14}px)`,opacity:0}],
      {duration:700+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove() }
  for(const sd of[-1,1]){ const c=document.createElement('i'); c.style.cssText=`width:26px;height:11px;left:${sd<0?x-6:x+w-20}px;top:${y-8}px;background:#8f8574`; L.appendChild(c);
    c.animate([{transform:'scale(.3)',opacity:.5},{transform:`translateX(${sd*24}px) scale(1.8)`,opacity:0}],{duration:800,easing:'ease-out'}).onfinish=()=>c.remove() } }
function slabStop(){ // a new click mid-drop: stop the drop in progress (stand-ins must not land later)
  SLABT.forEach(clearTimeout); SLABT=[];
  if(gCards) gCards.selectAll('*').interrupt('slab'); if(gNodes) gNodes.selectAll('*').interrupt('slab');
  if(gNodes) gNodes.selectAll('.slabtmp').remove(); if(gCards) gCards.selectAll('.slabtmp').remove(); }
function slabFocus(f,pos,Y,maxH,T,live){
  SLABT.forEach(clearTimeout); SLABT=[];
  const cardFill=css('--card'), line=css('--line'), acc=css('--accent');
  const out=live?220:0;                       // old view: quick fade (instant after a rebuild)
  slabStop();
  [gCards,gLinks,gLvl].forEach(g=>g.selectAll('*').interrupt().transition().duration(out).style('opacity',0).remove());
  gNodes.selectAll('.slabtmp').remove();
  gLabels.interrupt().transition().duration(out).style('opacity',0);
  gNodes.selectAll('path.node').interrupt().interrupt('color').transition().duration(out).style('opacity',0);
  // Entry 67b (Hanh): one drop per PERSON. Generation by generation (the next starts once the last one has landed);
  // inside a generation the people fall in random order, each blood relative before their spouse(s).
  const D=520, byL={}; pos.forEach((p,id)=>(byL[p.l]=byL[p.l]||[]).push(+id));
  const ev=[], land={}, first={}; let t=0;
  Object.keys(byL).map(Number).sort((a,b)=>a-b).forEach(l=>{
    const slots=[]; byL[l].forEach(id=>nodes[id].data.members.forEach(()=>slots.push(id)));
    for(let i=slots.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [slots[i],slots[j]]=[slots[j],slots[i]] }
    const G=Math.max(70,Math.min(170,1500/slots.length)), seen={}; first[l]=t;
    slots.forEach(id=>{ const i=seen[id]=(seen[id]??-1)+1; ev.push({id,i,t}); t+=G*(.7+Math.random()*.6) });
    land[l]=ev[ev.length-1].t+D; t=land[l]-D*.35 });
  SLABT.push(setTimeout(()=>{
    svg.interrupt().call(zoom.transform,T);
    { BANDCOLS=Object.keys(Y).map(Number).sort((a,b)=>a-b).map(l=>({x:Y[l],l,t:(VIEW?genNameV(l,f,pos):genName(l,f)),o:Math.max(.45,LV[l].o)}));
      const band=document.getElementById('band'); band.innerHTML=BANDCOLS.map(c=>`<span class="${c.l===0?'me':''}" data-o="${c.o}" style="opacity:0;transition:opacity .4s;font-size:${Math.max(11,18*LV[c.l].s).toFixed(1)}px">${bandHTML(c,f)}</span>`).join('');
      placeBand(T); [...band.children].forEach((sp,i)=>SLABT.push(setTimeout(()=>sp.style.opacity=sp.dataset.o,first[BANDCOLS[i].l]||0))) }
    const RS=new Map();
    gNodes.selectAll('path.node').each(function(d){ const el=d3.select(this), p=pos.get(d.id);
      if(!p){ el.style('opacity',0).style('pointer-events','none'); return }
      el.raise().style('pointer-events','auto'); const rs=rectsOf(p,d); curRects.set(d.id,rs); RS.set(d.id,rs);
      el.attr('d',rs.join(' ')).attr('fill',cardFill).attr('stroke',d===f?acc:line).attr('stroke-width',d===f?2.4:1.2).style('opacity',0) });
    const H=170/T.k, left={}, tmps={};
    ev.forEach(({id,i,t:t0})=>{ const n=nodes[id], p=pos.get(id), o=LV[p.l].o, rs=RS.get(id); left[id]=(left[id]||0)+1;
      const tp=gNodes.append('path').attr('class','slabtmp').attr('d',rs[i]).attr('fill',cardFill).attr('stroke',n===f?acc:line).attr('stroke-width',n===f?2.4:1.2).style('pointer-events','none');
      const bb=tp.node().getBBox(), cx=bb.x+bb.width/2, cy=bb.y+bb.height, mcy=bb.y+bb.height/2, r0=(Math.random()*16-8);
      // Entry 67c (Hanh): seen from above — the slab starts close to your eye (big) and falls away from you, shrinking
      // into its place (size = 1/distance, gravity speeds it up), then a small settle on impact.
      const tf=t=>{ let sc=1,rot=0;
        if(t<.78){ const u=t/.78, e=u*u, dist=1/5+(1-1/5)*e; sc=1/dist; rot=r0*(1-e) }
        else if(t<.86){ sc=1-.05*(t-.78)/.08 }
        else { sc=.95+.05*(t-.86)/.14 }
        return `translate(${cx},${mcy}) rotate(${rot}) scale(${sc}) translate(${-cx},${-mcy})` };
      const sh=gNodes.insert('path','path.node').attr('class','slabtmp').attr('d',rs[i]).attr('fill','#000').style('pointer-events','none').style('opacity',0);
      sh.transition('slab').delay(t0).duration(D*.78).ease(d3.easeQuadIn).style('opacity',.45).transition('slab').duration(D*.22).style('opacity',0).remove();
      (tmps[id]=tmps[id]||[]).push(sh.node());
      const w=gCards.append('g').attr('class','slabtmp'), cid='slabc'+id+'_'+i;
      w.append('clipPath').attr('id',cid).append('path').attr('d',rs[i]);
      const g=w.append('g').attr('clip-path',`url(#${cid})`).append('g').attr('class','card').attr('transform',`translate(${p.x},${p.y}) scale(${LV[p.l].s})`);
      cardContent(g,n); (tmps[id]=tmps[id]||[]).push(tp.node(),w.node());
      [tp,w].forEach(sel=>sel.attr('transform',tf(0)).style('opacity',0).transition('slab').delay(t0).duration(D).ease(d3.easeLinear)
        .attrTween('transform',function(){ const lead=this===w.node(); let hit=false;   // Entry 70: dust on the landing frame, not a separate timer
          return t=>{ if(lead&&!hit&&t>=.78){ hit=true; impact() } return tf(t) } })
        .styleTween('opacity',()=>t=>String(Math.min(1,t/.3)*o))
        .on('end',function(){ d3.select(this).attr('transform',null);
          if(this===w.node()&&--left[id]===0){ // whole couple down → swap the stand-ins for the real card
            tmps[id].forEach(e=>e.remove()); gNodes.selectAll('path.node').filter(d=>d.id===id).style('opacity',o);
            const rg=gCards.append('g').attr('class','card').attr('transform',`translate(${p.x},${p.y}) scale(${LV[p.l].s})`).style('opacity',o);
            cardContent(rg,n); rg.append('title').text(label(n.data)) } }));
      function impact(){ const Z=d3.zoomTransform(svg.node()); slabDust(Z.applyX(bb.x),Z.applyY(cy),bb.width*Z.k);
        svg.node().animate([{transform:'translateY(0)'},{transform:'translateY(1.5px)'},{transform:'translateY(0)'}],{duration:120}) } });
    pos.forEach((p,id)=>{ const n=nodes[id]; if(!(n.parent&&pos.has(n.parent.id))) return;
      const pp=pos.get(n.parent.id), lk=gLinks.append('path').attr('class','link').attr('d',linkPath(pp,p,busY(Y,maxH,p.l),n.parent.data.members.length,n.data.members.length,cardH(n.data),n.parent.data,n.data)).style('opacity',0);
      const len=lk.node().getTotalLength();
      lk.attr('stroke-dasharray',len).attr('stroke-dashoffset',len).transition().delay(land[p.l]).duration(450).style('opacity',Math.min(LV[p.l].o,LV[pp.l].o)).attr('stroke-dashoffset',0)
        .on('end',function(){ d3.select(this).attr('stroke-dasharray',null) }) });
    busy=false;
  },out+20));
}
