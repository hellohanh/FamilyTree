 const bare=t=>t.replace(/^(Ông|Bà) /,'').replace(/ \(.*\)$/,'');                    // "Bà Thương (Tường)" → "Thương"
 // the line under each name: con của <father> & <mother> · vợ/chồng của <spouse> · stepchild: con của <mother>
 function who(p){const d=p.d,par=d.parent;
  if(p.i>0)return (p.g==='F'?'vợ':p.g==='M'?'chồng':'vợ/chồng')+' của '+bare(d.data.n[0]);
  if(!par)return '';const pn=par.data,mi=d.data.m?pn.k.indexOf(d.data.m):(pn.n.length===2?1:-1);
  if(d.data.s&&mi>=0)return 'con của '+bare(pn.n[mi]);
  const ix=[0,mi].filter(i=>i>=0),same=ix.length>1&&bare(pn.n[ix[0]])===bare(pn.n[ix[1]]);   // Ông Cố & Bà Cố keep Ông/Bà
  const two=ix.map(i=>({nm:same?pn.n[i].replace(/ \(.*\)$/,''):bare(pn.n[i]),g:pn.g[i]}));two.sort((a,b)=>(a.g==='M'?0:1)-(b.g==='M'?0:1));
  return 'con của '+two.map(x=>x.nm).join(' & ')}
 const IDX=P.filter(p=>!p.nm.startsWith('??')).map(p=>({p,key:fold(p.nm),w:who(p)}));   // unknown "??" people are left out
 const q=$('q'),res=$('res');
 function show(){const t=fold(q.value.trim());res.innerHTML='';if(!t)return;
  const hits=IDX.filter(x=>(' '+x.key.replace(/[()]/g,' ')).includes(' '+t))   /* any word of the name or nickname starts with what's typed */.sort((a,b)=>(a.key.startsWith(t)?0:1)-(b.key.startsWith(t)?0:1)||a.key.localeCompare(b.key)).slice(0,40);
  if(!hits.length){res.innerHTML='<div class="none">No one by that name</div>';return}
  hits.forEach(x=>{const b=document.createElement('button');b.setAttribute('role','option');b.innerHTML='<b></b><small></small>';b.querySelector('b').textContent=x.p.nm;b.querySelector('small').textContent=x.w;b.onclick=()=>pick(x.p);res.appendChild(b)})}
 q.addEventListener('input',show);
 q.addEventListener('keydown',e=>{if(e.key==='Enter'){const f=res.querySelector('button');if(f)f.click()}});
 // pick: snap the wheel to that person and make them the focal
 function pick(p){document.body.classList.remove('pane-open');q.blur();   // Entry 93: the pane hides after a pick (computers too)
  const th=(((p.a0+p.a1)/2)%TAU+TAU)%TAU;FOCAL=p;snapTo(th,p.d.depth===4?3:p.d.depth);paintFocal();nav();hint()}
})();
/* ================= Quick pane items (Entry 94) ================= */
function paneSync(){$('pWhole').disabled=!SNAP;$('pClear').disabled=!FOCAL;$('pClearSub').textContent=FOCAL?FOCAL.nm:'No one picked';
 $('pCentral').setAttribute('aria-pressed',CENTRAL);$('pCentralSub').textContent="Ba's younger sister: "+(CENTRAL?'O':'Cô')}
(function(){const shut=()=>document.body.classList.remove('pane-open');
 $('pWhole').onclick=()=>{if(!SNAP)return;shut();whole();paneSync()};
 $('pClear').onclick=()=>{if(!FOCAL)return;shut();FOCAL=null;paintFocal();labels();nav();hint();paneSync()};
 $('pCentral').onclick=()=>{CENTRAL=!CENTRAL;labels();paneSync()};
 new MutationObserver(paneSync).observe(document.body,{attributes:true,attributeFilter:['class']});paneSync()})();
/* ================= Header (Entry 96) ================= */
(function(){const setHH=()=>{document.documentElement.style.setProperty('--hh',$('hdr').offsetHeight+'px')};
 let last;const crumb=()=>{const t=FOCAL?FOCAL.nm:'';if(t===last)return;last=t;$('crumb').innerHTML='';if(t){$('crumb').append('Focused on ');const b=document.createElement('b');b.textContent=t;$('crumb').append(b)}setHH();size()};
 const _p=paintFocal;paintFocal=function(){_p();crumb()};
 setHH();addEventListener('resize',setHH);size()})();
/* ================= Simple view (Entry 97) ================= */
(function(){
 let CW=210,CH=58,GX=18,GY=70,PAD=28;const MALE='#7db4ff',FEM='#ff8fc0';
 const ss=d3.select('#ssv');
 // Entry 101 (Hanh): a child's card also shows their wife / husband, one line each under the child
 const spouses=p=>P.filter(q=>q.d===p.d&&q.i>0),SL=()=>Math.round(CH*.8);
 // Entry 102 (Hanh): avatars instead of ♂/♀ — Entry 77's rules: a couple shares one set; Ông Cố & Bà Cố are set 6;
 // until Hanh picks a set for a couple it is a steady random pick (same set every visit); a real photo will replace it
 const SETS=['set1-blue','set2-black-white','set3-gold-red','set4-porcelain-jade','set5-purple-lilac','set6-brown-checkered'];
 const setOf=d=>{if(!d.parent)return 5;let h=0;for(const ch of d.data.k[0])h=(h*31+ch.charCodeAt(0))>>>0;return h%6};
 const avatar=q=>q.g==='F'||q.g==='M'?`assets/avatars/${SETS[setOf(q.d)]}-${q.g==='F'?'female':'male'}.webp`:'';
 const cardH=(p,role)=>role==='child'?CH+spouses(p).length*SL():CH;
 const line0=(p,role)=>{const n=role==='child'?1+spouses(p).length:1,LH=(cardH(p,role)-(n>1?12:0))/n;return (n>1?6:0)+LH/2};
 function card(g,x,y,w,p,role){   // role: 'focal' | 'couple' | 'child'
  const people=role==='child'?[p,...spouses(p)]:[p],h=cardH(p,role),n=people.length,LH=(h-(n>1?12:0))/n,fs=CW<200?14:16;
  const G=g.append('g').attr('class','card').attr('transform',`translate(${x},${y})`);
  G.append('rect').attr('width',w).attr('height',h).attr('rx',9).attr('fill','#242424').attr('stroke',role==='child'?'#4a4a4a':GOLD).attr('stroke-width',role==='child'?1:(role==='focal'?3:2));
  people.forEach((q,k)=>{const cy=(n>1?6:0)+LH*(k+.5),R=G.append('g').style('cursor','pointer').on('click',e=>{e.stopPropagation();go(q)});
   R.append('rect').attr('x',2).attr('y',cy-LH/2).attr('width',w-4).attr('height',LH).attr('fill','transparent');
   if(k)R.append('line').attr('x1',14).attr('x2',w-14).attr('y1',cy-LH/2).attr('y2',cy-LH/2).attr('stroke','#363636');
   const av=avatar(q),AS=Math.min(LH-8,k?34:44);let x0;
   if(av){R.append('image').attr('href',av).attr('x',10).attr('y',cy-AS/2).attr('width',AS).attr('height',AS);x0=10+AS+10}
   else{R.append('text').attr('x',16).attr('y',cy).attr('dy','.35em').attr('font-size',k?16:19).attr('font-weight',700).attr('fill','#9a948a').text('?');x0=38}const title=q===FOCAL?'':titleOf(FOCAL.cell,q.cell),f=k?fs*.92:fs;
   if(title){const tw=W(title,f*.85,700)+10;R.append('rect').attr('x',x0).attr('y',cy-f*.65).attr('width',tw).attr('height',f*1.3).attr('rx',4).attr('fill',CHIP);
    R.append('text').attr('x',x0+5).attr('y',cy).attr('dy','.35em').attr('font-size',f*.85).attr('font-weight',700).attr('fill','#161616').text(title);x0+=tw+7}
   R.append('text').attr('x',x0).attr('y',cy).attr('dy','.35em').attr('font-size',f).attr('font-weight',q===FOCAL?700:400).attr('fill','#f1ece4').text(fit(q.nm,f,w-x0-12,q===FOCAL?700:400))})}
 // Entry 97 (Hanh): children always in a column; with two wives each mother's children hang from her
 function draw(){if(!FOCAL)return;ss.selectAll('*').remove();const ph=innerWidth<=820;CW=ph?150:210;CH=ph?58:66;GX=ph?14:22;PAD=ph?16:28;
  const d=FOCAL.d,couple=P.filter(q=>q.d===d),VG=ph?10:14,IND=ph?14:18,DROP=ph?26:34,KW=CW-IND-6;
  const groups=new Map();(d.children||[]).forEach(c=>{const kid=P.find(q=>q.d===c&&q.i===0);
   let mi=c.data.m?d.data.k.indexOf(c.data.m):(couple.length===2?1:0);if(mi<0)mi=0;if(!groups.has(mi))groups.set(mi,[]);groups.get(mi).push(kid)});
  if(ph)return outline(d,couple,groups,{VG,IND,KW});   // phones: an outline — husband, each wife below him, her children under her
  // Hanh: with two wives, the husband sits in the centre — first wife on the left, second on the right (slot order)
  const slot=couple.length===3?[1,0,2]:couple.map((_,i)=>i),LEFT=mi=>couple.length===3&&slot[mi]===0;
  const lpad=couple.length===3&&groups.has(1)?Math.max(0,IND+KW-CW/2):0;   // room for the left wife's children, which hang to her left
  const cw=couple.length*CW+(couple.length-1)*GX,cx=i=>PAD+lpad+slot[i]*(CW+GX);
  // where each group's line drops from: the couple's middle (one spouse) or the mother herself (two or more wives)
  const dropX=mi=>couple.length===1?cx(0)+CW/2:couple.length===2?cx(0)+CW+GX/2:cx(mi)+CW/2;
  let maxN=0,right=PAD+lpad+cw;groups.forEach((ks,mi)=>{maxN=Math.max(maxN,ks.reduce((t,q)=>t+cardH(q,'child')+VG,-VG));right=Math.max(right,dropX(mi)+IND+KW)});
  const Wd=right+PAD,y1=PAD,yk=y1+CH+DROP,Hd=yk+Math.max(0,maxN)+PAD;
  const box=$('simple').getBoundingClientRect(),k=Math.max(.75,Math.min(1.2,(box.width-16)/Wd));
  ss.attr('width',Wd*k).attr('height',Hd*k).attr('viewBox',`0 0 ${Wd} ${Hd}`).style('margin-top',Math.max(8,(box.height-64-Hd*k)/2)+'px');
  const g=ss.append('g'),L=g.append('g'),ln=(a,b,c,e)=>L.append('line').attr('x1',a).attr('y1',b).attr('x2',c).attr('y2',e).attr('stroke','#6b6b6b').attr('stroke-width',1.6);
  if(couple.length===2)ln(cx(0)+CW,y1+CH/2,cx(1),y1+CH/2);                               // marriage line
  if(couple.length>2){const xs=couple.map((_,i)=>cx(i)).sort((a,b)=>a-b);for(let i=1;i<xs.length;i++)ln(xs[i-1]+CW,y1+CH/2,xs[i],y1+CH/2)}
  groups.forEach((ks,mi)=>{const x=dropX(mi),y0=couple.length===2?y1+CH/2:y1+CH,last=yk+(ks.length-1)*(CH+VG)+CH/2;
   const lf=LEFT(mi);let yy=yk,lastY=y0;ks.forEach(q=>{const c=yy+line0(q,'child');ln(x,c,lf?x-IND:x+IND,c);lastY=c;card(g,lf?x-IND-KW:x+IND,yy,KW,q,'child');yy+=cardH(q,'child')+VG});ln(x,y0,x,lastY)});
  couple.forEach((q,i)=>card(g,cx(i),y1,CW,q,q===FOCAL?'focal':'couple'))}
 // phones with two or more wives: the husband on top; each wife below him on the line, her children under her
 function outline(d,couple,groups,o){const {VG,IND}=o,W2=Math.min(330,$('simple').getBoundingClientRect().width-16-PAD*2),ln=(a,b,c,e)=>L.append('line').attr('x1',a).attr('y1',b).attr('x2',c).attr('y2',e).attr('stroke','#6b6b6b').attr('stroke-width',1.6);
  const rows=[];rows.push({p:couple[0],x:PAD,w:W2,role:couple[0]===FOCAL?'focal':'couple'});
  couple.slice(1).forEach((w,i)=>{rows.push({p:w,x:PAD+IND,w:W2-IND,role:w===FOCAL?'focal':'couple',wife:true});(groups.get(i+1)||[]).forEach(k=>rows.push({p:k,x:PAD+IND*2,w:W2-IND*2,role:'child'}))});
  (groups.get(0)||[]).forEach(k=>rows.push({p:k,x:PAD+IND,w:W2-IND,role:'child'}));
  const YS=[];let acc=PAD;rows.forEach(r=>{YS.push(acc);acc+=cardH(r.p,r.role)+VG});const Wd=PAD*2+W2,Hd=acc-VG+PAD,box=$('simple').getBoundingClientRect(),k=Math.max(.75,Math.min(1.2,(box.width-16)/Wd));
  ss.attr('width',Wd*k).attr('height',Hd*k).attr('viewBox',`0 0 ${Wd} ${Hd}`).style('margin-top','8px');
  const g=ss.append('g');var L=g.append('g');
  const Y=i=>YS[i],M=i=>YS[i]+line0(rows[i].p,rows[i].role);let wifeIdx=[];rows.forEach((r,i)=>{if(r.wife)wifeIdx.push(i)});
  // husband's line down to each wife; each wife's line down to her children
  if(wifeIdx.length){const x=PAD+IND/2;L.append('line').attr('x1',x).attr('y1',Y(0)+CH).attr('x2',x).attr('y2',M(wifeIdx[wifeIdx.length-1])).attr('stroke','#6b6b6b').attr('stroke-width',1.6);
   wifeIdx.forEach(i=>L.append('line').attr('x1',x).attr('y1',M(i)).attr('x2',PAD+IND).attr('y2',M(i)).attr('stroke','#6b6b6b').attr('stroke-width',1.6))}
  wifeIdx.forEach((wi,n)=>{const end=(n+1<wifeIdx.length?wifeIdx[n+1]:rows.length);const kids=[];for(let i=wi+1;i<end;i++)if(rows[i].role==='child'&&rows[i].x===PAD+IND*2)kids.push(i);
   if(!kids.length)return;const x=PAD+IND+IND/2;L.append('line').attr('x1',x).attr('y1',Y(wi)+CH).attr('x2',x).attr('y2',M(kids[kids.length-1])).attr('stroke','#6b6b6b').attr('stroke-width',1.6);
   kids.forEach(i=>L.append('line').attr('x1',x).attr('y1',M(i)).attr('x2',PAD+IND*2).attr('y2',M(i)).attr('stroke','#6b6b6b').attr('stroke-width',1.6))});
  rows.forEach((r,i)=>card(g,r.x,Y(i),r.w,r.p,r.role))}
 // tapping a card makes that person the focal; a child opens their own family unit
 function go(p){FOCAL=p;paintFocal();labels();nav();hint();sync();draw()}
 function open(){if(!FOCAL)return;document.body.classList.remove('pane-open');document.body.classList.add('simple');draw()}
 function close(){document.body.classList.remove('simple');labels()}
 function sync(){$('pSimple').disabled=!FOCAL;$('pSimpleSub').textContent=FOCAL?(FOCAL.d.data.n.map(n=>n.replace(/ \(.*\)$/,'')).join(' & ')):'Pick a focal first'}
 $('pSimple').onclick=open;$('sBack').onclick=close;
 addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('simple')&&!document.body.classList.contains('pane-open'))close()});
 addEventListener('resize',()=>{if(document.body.classList.contains('simple'))draw()});
 new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['class']});sync();
 window.simpleDraw=draw})();
</script>
