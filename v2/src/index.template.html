function hint(){$('hint').textContent=SNAP?(FOCAL?'':'Tap a person to see everyone from their side · double-tap to open their family'):'Tap anywhere on the wheel'}
function size(){const r=sv.node().getBoundingClientRect();VH=1000;VW=1000*r.width/r.height;sv.attr('viewBox',`${-VW/2} ${-VH/2} ${VW} ${VH}`);
 if(SNAP){const th=((90-V.rot)*Math.PI/180+4*Math.PI)%(2*Math.PI),v0=snapV(th,RING,V.rot),G=geoTarget(RING,v0.k),th2=mapA(th,G);geo(G,0);V=snapV(th2,RING,V.rot)}else V=wholeV();wheel.attr('transform',tf(V));gC.attr('transform',`rotate(${-V.rot})`);paintFocal();labels()}
addEventListener('resize',size);
// drag up/down turns the snapped wheel; taps under 6 px stay taps
sv.call(d3.drag().clickDistance(6).filter(e=>SNAP&&!e.button).on('drag',e=>{const upp=VW/sv.node().getBoundingClientRect().width;V.rot+=e.dy*upp/(r0[RING+1]*V.k)*180/Math.PI;wheel.attr('transform',tf(V));gC.attr('transform',`rotate(${-V.rot})`)}).on('end',labels));
let tapT=null;
sv.on('click',e=>{const [x,y]=d3.pointer(e,wheel.node()),r=Math.hypot(x,y),theta=(Math.atan2(x,-y)+2*Math.PI)%(2*Math.PI);
 if(!SNAP){const ring=r>=r0[5]?3:Math.max(1,r0.findIndex((v,i)=>i>0&&r<v)-1);snapTo(theta,ring);return}
 const p=P.find(q=>r>=r0[q.d.depth]&&r<r0[q.d.depth+1]&&theta>=q.a0&&theta<q.a1);if(!p)return;
 if(tapT){clearTimeout(tapT);tapT=null;toast(p.nm+': family view comes next');return}            // double tap → family view (not built yet)
 tapT=setTimeout(()=>{tapT=null;FOCAL=FOCAL===p?null:p;paintFocal();nav();hint();geo(geoTarget(RING,V.k),550,p)},320)});    // single tap → focal (tap again to clear)
$('prev').onclick=()=>{if(RING>1)snapTo(((90-V.rot)*Math.PI/180+4*Math.PI)%(2*Math.PI),RING-1)};
$('next').onclick=()=>{if(RING<3)snapTo(((90-V.rot)*Math.PI/180+4*Math.PI)%(2*Math.PI),RING+1)};
$('whole').onclick=whole;
size();hint();
</script>
</body>
