// Entry 84: scrolling layout for the snapped view. Every person in the two rings on screen gets at least 30 px at the
// inner edge of their slice, so names and chips there stay at full size (17 px); rings beyond them split their
// parent's slice proportionally and their names shrink to fit. Laid end to end the two rings can need more than one
// full turn (phones). Then the stretch on screen is shown at full
// size, the part hidden off the left edge is squeezed, and dragging scrolls through the family like a list.
const TAU=2*Math.PI;let UT=TAU,UC=0,TH=0,WW=Math.PI;   // UT unrolled length · UC unrolled spot at screen centre · TH wheel angle at screen centre · WW half-width shown full size
function needs(ring,k){const upp=VW/sv.node().getBoundingClientRect().width,px=30*upp/k;
 const own=d=>d.depth===ring||d.depth===ring+1?d.data.n.length*(px/r0[d.depth]+.004):0,mn=new Map();
 h.eachAfter(d=>mn.set(d,Math.max(own(d),(d.children||[]).reduce((s,c)=>s+mn.get(c),0))));return mn}
// thin families widen, roomy ones give space back, children stay under their parents, outer rings split their parent proportionally
function unroll(ring,k){const mn=needs(ring,k);UT=Math.max(TAU,mn.get(h));h.U0=0;h.U1=UT;
 h.eachBefore(d=>{if(!d.children)return;const a=d.U0,A=d.U1-d.U0,cs=d.children,m=c=>mn.get(c),clamp=new Set();
  let lam=0;for(let it=0;it<=cs.length;it++){const fr=cs.filter(c=>!clamp.has(c)),W=fr.reduce((s,c)=>s+c.value,0);
   if(!W)break;lam=(A-[...clamp].reduce((s,c)=>s+m(c),0))/W;const nw=fr.filter(c=>lam*c.value<m(c));if(!nw.length)break;nw.forEach(c=>clamp.add(c))}
  const all=cs.every(c=>clamp.has(c)),Wall=cs.reduce((s,c)=>s+c.value,0),rest=A-cs.reduce((s,c)=>s+m(c),0);let x=a;
  cs.forEach(c=>{const w=all?m(c)+rest*c.value/Wall:clamp.has(c)?m(c):lam*c.value;c.U0=x;c.U1=x+w;x+=w})})}
function proportional(){h.each(d=>{d.U0=d.x0;d.U1=d.x1});UT=TAU}
// unrolled distance past the screen centre → angle past the screen centre (full size inside ±WW, squeezed behind)
function F(dd){const T=UT;if(T<=TAU+1e-9)return dd;const w=Math.min(WW,T/2);if(dd<=w)return dd;if(dd>=T-w)return TAU-(T-dd);return w+(dd-w)*(TAU-2*w)/(T-2*w)}
function targetL(){const G=new Map();h.each(d=>{const d0=((d.U0-UC)%UT+UT)%UT,e=d0+(d.U1-d.U0);let a=TH+F(d0),b=TH+(e<=UT?F(e):TAU+F(e-UT));if(d.depth===0){a=TH;b=TH+TAU}if(a>TH+Math.PI){a-=TAU;b-=TAU}G.set(d,[a,b])});return G}
// what part of the wheel is on screen in view v (half-width, radians), so it can be shown full size
function visW(v,ring){let w=0;const rs=d3.range(r0[ring-1]||0,(r0[ring+3]||r0[5])+1,10);
 for(let a=0;a<=Math.PI;a+=.01)for(const r of rs){const x=v.x+r*v.k*Math.cos(a),y=r*v.k*Math.sin(a);if(x>-VW/2&&x<VW/2&&Math.abs(y)<VH/2)w=a}
 return Math.min(Math.PI*.85,w+.12)}
const inA=(t,a0,a1)=>((t-a0)%TAU+TAU)%TAU<a1-a0;
function spread(){P.forEach(p=>{const d=p.d,m=d.data.n.length;p.a0=d.L0+(d.L1-d.L0)*p.i/m;p.a1=d.L0+(d.L1-d.L0)*(p.i+1)/m;p.el.attr('d',arcOf(p))})}
// the unrolled spot (new layout) of a wheel angle in the current picture
function mapA(th){const l=h.leaves().find(d=>inA(th,d.L0,d.L1));if(!l)return UC;const f=(((th-l.L0)%TAU+TAU)%TAU)/(l.L1-l.L0||1);return l.U0+f*(l.U1-l.U0)}
// slide every slice to its new angle
function geo(G,ms){const S=new Map();h.each(d=>S.set(d,[d.L0,d.L1]));h.each(d=>{const g=G.get(d),n=Math.round((S.get(d)[0]-g[0])/TAU);G.set(d,[g[0]+n*TAU,g[1]+n*TAU])});
 const step=t=>{h.each(d=>{const s=S.get(d),e=G.get(d);d.L0=s[0]+(e[0]-s[0])*t;d.L1=s[1]+(e[1]-s[1])*t});spread()};
 gP.interrupt('geo');if(!ms){step(1);return}
 gP.transition('geo').duration(ms).ease(d3.easeCubicInOut).tween('geo',()=>step)}
const KI={};KIN.cells.forEach((c,i)=>KI[c]=i);
const titleOf=(viewer,cell)=>viewer?KIN.titles[KIN.M[viewer][KI[cell]]]||'':'';
const wheel=sv.append('g'),gP=wheel.append('g'),gL=wheel.append('g'),gC=wheel.append('g');
let V={x:0,y:0,rot:0,k:1},SNAP=false,RING=1,FOCAL=null,VW=1000,VH=1000;
const tf=v=>`translate(${v.x},${v.y}) rotate(${v.rot}) scale(${v.k})`;
P.forEach(p=>{const col=BR[p.d.br%5],FC=d3.interpolateRgb(d3.interpolateRgb(col,'#161616')(p.i?.2:0),'#ffffff')((p.d.depth-1)*.16);p.FC=FC;p.TC=d3.lab(FC).l>58?'#161616':'#fff6ec';
 p.el=gP.append('path').attr('d',arcOf(p)).attr('fill',FC).attr('stroke','#161616').attr('stroke-width',.8)});
// centre: Ông Cố & Bà Cố, square avatars; their title appears only once a focal is picked
const S=66,GAP=6;T.g.split('').forEach((gg,i)=>{const x=(i-.5)*(S+GAP);gC.append('image').attr('href',AVS[gg]).attr('x',x-S/2).attr('y',-S/2-6).attr('width',S).attr('height',S)});
const ctitle=gC.append('text').attr('y',S/2+16).attr('text-anchor','middle').attr('fill','#f1ece4').attr('font-size',14).attr('font-weight',700);

// generation names counted from the focal person (Entry 79): Ông Bà Tổ … Ba Má · Con · Cháu … Chít
// Entry 85: every band above the focal starts with Đời
const UP=['','Đời Ba Má','Đời Ông Bà','Đời Ông Bà Cố','Đời Ông Bà Sơ','Đời Ông Bà Tổ'],DOWN=['Con','Cháu','Chắt','Chút','Chít'];
function side(){ if(!FOCAL||FOCAL.i>0||!FOCAL.d.parent||FOCAL.d.parent.depth<0) return '';   // spouses: no Nội/Ngoại
  const par=FOCAL.d.parent; return par.data.g[0]==='M'?' Nội':par.data.g[0]==='F'?' Ngoại':'' }
function genName(depth){ if(!FOCAL) return DOWN[depth-1]||'';   // before a focal: from Ông Cố & Bà Cố down
  const diff=depth-FOCAL.d.depth; if(diff===0) return 'Đời '+FOCAL.nm.replace(/ \(.*\)$/,'');   // Entry 85: the focal's own band
  if(diff===1) return 'Con Cháu';   // Hanh: "Đời Hậu · Con Cháu" (the focal's children and nieces/nephews)
  if(diff>0) return DOWN[diff-1]||'';
  const up=Math.min(5,-diff); return UP[up]+(up>=2?side():'') }

function labels(){gL.selectAll('*').remove();const k=V.k,upp=VW/sv.node().getBoundingClientRect().width;
 P.forEach(p=>{const d=p.d,mid=(p.a0+p.a1)/2,deg=mid*180/Math.PI-90,rin=r0[d.depth]+8/k,len=(r0[d.depth+1]-r0[d.depth])*k-16*upp,span=(p.a1-p.a0)*(r0[d.depth]+4)*k;
  const fs=SNAP?Math.min(17*upp,span*.8,(span-6*upp)/1.3)   /* the two rings always fit 17 px (Entry 84); other rings shrink to fit with 3 px above and below the chip */:Math.min(FS[d.depth]*k,span*.8);if(fs<5.5*Math.min(1,k))return;   // whole wheel: names scale with the wheel
  const foc=FOCAL===p,mm=p.nm.match(/^(.*?) (\(.*\))$/),TR=`rotate(${deg}) translate(${rin},0) scale(${1/k})`;
  const tx=gL.append('text').attr('transform',TR).attr('font-size',fs).attr('fill',p.TC).attr('font-weight',foc?700:400);
  const title=SNAP&&FOCAL&&!foc?titleOf(FOCAL.cell,p.cell):'';   // titles only in the snapped view
  if(title){const tw=W(title,fs*.85,700)+10,ch=fs*1.3;   // Entry 79: title in a dark-mustard chip before the name
   gL.append('rect').attr('transform',TR).attr('y',-ch/2).attr('width',tw).attr('height',ch).attr('rx',4).attr('fill',CHIP);
   gL.append('text').attr('transform',TR).attr('x',5).attr('dy','0.35em').attr('font-size',fs*.85).attr('font-weight',700).attr('fill','#161616').text(title);
   tx.attr('x',tw+6).attr('dy','0.35em').text(fit(p.nm,fs,len-tw-6));return}
  if(mm&&span>=fs*2.5){tx.append('tspan').attr('x',0).attr('dy','-0.2em').text(fit(mm[1],fs,len,foc?700:400));tx.append('tspan').attr('x',0).attr('dy','1.1em').attr('font-size',fs*.9).text(fit(mm[2],fs*.9,len))}
  else{const t=fit(p.nm,fs,len,foc?700:400);if(!t){tx.remove();return}tx.attr('dy','0.35em').text(t)}});
 ctitle.selectAll('*').remove();ctitle.text(null);   // Entry 86: one title per line under Ông Cố & Bà Cố
 (FOCAL?[titleOf(FOCAL.cell,T.k[0]),titleOf(FOCAL.cell,T.k[1])].filter(Boolean):[]).forEach((t,i)=>ctitle.append('tspan').attr('x',0).attr('dy',i?'1.2em':0).text(t))}
function paintFocal(){P.forEach(q=>q.el.attr('stroke',q===FOCAL?GOLD:'#161616').attr('stroke-width',q===FOCAL?5/V.k:.8));if(FOCAL)FOCAL.el.raise()}
function go(v,ms){const a=Object.assign({},V);gL.interrupt().transition().duration(ms*.3).style('opacity',0);
 wheel.interrupt().transition().duration(ms).ease(d3.easeCubicInOut).attrTween('transform',()=>t=>{const c={x:a.x+(v.x-a.x)*t,y:a.y+(v.y-a.y)*t,rot:a.rot+(v.rot-a.rot)*t,k:a.k*Math.pow(v.k/a.k,t)};gC.attr('transform',`rotate(${-c.rot})`);return tf(c)})
  .on('end',()=>{V=v;paintFocal();labels();gL.transition().duration(250).style('opacity',1)})}
function wholeV(){return {x:0,y:0,rot:0,k:Math.min(VW,VH)/1000*.97}}
// snapped: two rings + a sliver of the inner one; wide screens also show part of the next ring
function snapV(theta,ring,rot0){const k=Math.min(VW-70,VH*1.1)/(r0[ring+2]-r0[ring]);let rot=90-theta*180/Math.PI;while(rot-rot0>180)rot-=360;while(rot-rot0<-180)rot+=360;return {x:-VW/2+60-r0[ring]*k,y:0,rot,k}}
function snapTo(theta,ring){SNAP=true;document.body.classList.add('snap');RING=Math.max(1,Math.min(3,ring));
 const v=snapV(theta,RING,V.rot);unroll(RING,v.k);UC=mapA(theta);TH=theta;WW=visW(v,RING);geo(targetL(),800);go(v,800);nav();hint()}
function whole(){SNAP=false;document.body.classList.remove('snap');proportional();UC=TH;geo(targetL(),700);go(wholeV(),700);hint()}
function nav(){$('genLbl').querySelector('b').textContent=genName(RING)+' · '+genName(RING+1);$('genLbl').querySelector('small').textContent='Rings '+RING+'–'+(RING+1)+' of 4';$('prev').disabled=RING<=1;$('next').disabled=RING>=3}
function hint(){$('hint').textContent=SNAP?(FOCAL?'':'Tap a person to see everyone from their side · double-tap to open their family'):'Tap anywhere on the wheel'}
function size(){const r=sv.node().getBoundingClientRect();VH=1000;VW=1000*r.width/r.height;sv.attr('viewBox',`${-VW/2} ${-VH/2} ${VW} ${VH}`);
 if(SNAP){const v=snapV(TH,RING,V.rot);unroll(RING,v.k);UC=mapA(TH);WW=visW(v,RING);geo(targetL(),0);V=v}else V=wholeV();wheel.attr('transform',tf(V));gC.attr('transform',`rotate(${-V.rot})`);paintFocal();labels()}
addEventListener('resize',size);
// drag up/down turns the snapped wheel; taps under 6 px stay taps
// (Entry 84: dragging scrolls the family past the screen; slices grow to full size as they come on screen)
let lblF=0;const lblSoon=()=>{if(!lblF)lblF=requestAnimationFrame(()=>{lblF=0;labels()})};
// Entry 85: one finger drags (snapped → scrolls the family; whole wheel → turns the wheel around its centre);
// two fingers pinch to zoom the whole wheel (mouse wheel on computers). A tap still snaps / picks the focal.
const PT=new Map();let moved=0,pinch0=null;
const toV=(cx,cy)=>{const R=sv.node().getBoundingClientRect(),upp=VW/R.width;return [(cx-R.left)*upp-VW/2,(cy-R.top)*upp-VH/2]};
function zoomAt(s,cx,cy){const base=wholeV().k,k1=Math.max(base*.8,Math.min(base*4,V.k*s));s=k1/V.k;const [mx,my]=toV(cx,cy);
 V.x=mx-(mx-V.x)*s;V.y=my-(my-V.y)*s;V.k=k1;if(V.k<=base*1.02){V.x*=.8;V.y*=.8}wheel.attr('transform',tf(V));lblSoon()}
sv.on('pointerdown',e=>{if(e.button)return;PT.set(e.pointerId,[e.clientX,e.clientY]);if(PT.size===1)moved=0;try{sv.node().setPointerCapture(e.pointerId)}catch(_){}
 if(PT.size===2){const [a,b]=[...PT.values()];pinch0=Math.hypot(a[0]-b[0],a[1]-b[1]);moved=99}});
sv.on('pointermove',e=>{const prev=PT.get(e.pointerId);if(!prev)return;const cur=[e.clientX,e.clientY];
 if(PT.size===1){const upp=VW/sv.node().getBoundingClientRect().width;moved+=Math.hypot(cur[0]-prev[0],cur[1]-prev[1]);
  if(moved>6){if(SNAP){UC-=(cur[1]-prev[1])*upp/(r0[RING+1]*V.k);geo(targetL(),0);lblSoon()}
   else{const [x0,y0]=toV(...prev),[x1,y1]=toV(...cur);let d=Math.atan2(y1-V.y,x1-V.x)-Math.atan2(y0-V.y,x0-V.x);if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;
    V.rot+=d*180/Math.PI;wheel.attr('transform',tf(V));gC.attr('transform',`rotate(${-V.rot})`)}}}
 PT.set(e.pointerId,cur);
 if(PT.size===2&&!SNAP&&pinch0){const [a,b]=[...PT.values()],dd=Math.hypot(a[0]-b[0],a[1]-b[1]);zoomAt(dd/pinch0,(a[0]+b[0])/2,(a[1]+b[1])/2);pinch0=dd}});
const ptUp=e=>{PT.delete(e.pointerId);if(PT.size<2)pinch0=null;if(!PT.size&&moved>6)lblSoon()};
sv.on('pointerup',ptUp).on('pointercancel',ptUp);
sv.on('wheel',e=>{if(SNAP)return;e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
let tapT=null;
sv.on('click',e=>{if(moved>6)return;const [x,y]=d3.pointer(e,wheel.node()),r=Math.hypot(x,y),theta=(Math.atan2(x,-y)+2*Math.PI)%(2*Math.PI);
 if(!SNAP){const ring=r>=r0[5]?3:Math.max(1,r0.findIndex((v,i)=>i>0&&r<v)-1);snapTo(theta,ring);return}
 const p=P.find(q=>r>=r0[q.d.depth]&&r<r0[q.d.depth+1]&&inA(theta,q.a0,q.a1));if(!p)return;
 if(tapT){clearTimeout(tapT);tapT=null;toast(p.nm+': family view comes next');return}            // double tap → family view (not built yet)
 tapT=setTimeout(()=>{tapT=null;FOCAL=FOCAL===p?null:p;paintFocal();labels();nav();hint()},320)});    // single tap → focal (tap again to clear)
$('prev').onclick=()=>{if(RING>1)snapTo(TH,RING-1)};
$('next').onclick=()=>{if(RING<3)snapTo(TH,RING+1)};
$('whole').onclick=whole;
size();hint();
/* ================= Navigation pane (Entry 89) ================= */
(function(){ const body=document.body, pane=$('pane'), scrim=$('scrim'), PH=()=>matchMedia('(max-width:820px)').matches;
 const open=()=>{body.classList.add('pane-open');pane.style.transform='';scrim.style.opacity=''}, close=()=>{body.classList.remove('pane-open');pane.style.transform='';scrim.style.opacity=''};
 $('lHandle').onclick=open; $('pClose').onclick=e=>{e.stopPropagation();close()}; scrim.onclick=close;
 addEventListener('keydown',e=>{if(e.key==='Escape'&&body.classList.contains('pane-open'))close()});
 // phones: the handle follows the finger (TNCFL tracker rules): past 30 % or a quick flick opens/closes
 const Wd=()=>pane.getBoundingClientRect().width;
 function drag(x0,fromOpen){const t0=Date.now();let dx=0;body.classList.add('pane-drag');
  return {move(x){dx=x-x0;const w=Wd(),off=fromOpen?Math.max(0,Math.min(w,dx)):Math.max(0,Math.min(w,w+dx));pane.style.transform='translateX('+off+'px)';scrim.style.opacity=String(1-off/w);scrim.style.pointerEvents='none'},
   end(){body.classList.remove('pane-drag');scrim.style.pointerEvents='';const w=Wd(),v=dx/Math.max(1,Date.now()-t0);(fromOpen?!(dx>w*.3||v>.5):(dx<-w*.3||v<-.5))?open():close()}}}
 let d=null;const rh=$('rHandle');
 rh.addEventListener('touchstart',e=>{d=drag(e.touches[0].clientX,false);d.moved=false},{passive:true});
 rh.addEventListener('touchmove',e=>{if(d){d.moved=true;d.move(e.touches[0].clientX);e.preventDefault()}},{passive:false});
 rh.addEventListener('touchend',e=>{if(d){d.moved?d.end():(body.classList.remove('pane-drag'),open());d=null;e.preventDefault()}});
 rh.addEventListener('click',()=>{if(!body.classList.contains('pane-open'))open()});
 pane.addEventListener('touchstart',e=>{if(!PH())return;d=drag(e.touches[0].clientX,true);d.moved=false},{passive:true});
 pane.addEventListener('touchmove',e=>{if(d){d.moved=true;d.move(e.touches[0].clientX)}},{passive:true});
 pane.addEventListener('touchend',()=>{if(d){d.moved?d.end():body.classList.remove('pane-drag');d=null}});
})();
</script>
