# Keeps the free Supabase project awake (it sleeps after 7 days with no activity) — Entry 75.
# Reads the one-row heartbeat table every 3 days. Uses the repo secrets SUPABASE_URL and SUPABASE_KEY (publishable key).
name: Keep Supabase awake
on:
  schedule:
    - cron: '17 14 */3 * *'   # every 3rd day, 14:17 UTC (≈ 9 am Central)
  workflow_dispatch: {}        # "Run workflow" button for a manual check
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the heartbeat row
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          curl -fsS "$SUPABASE_URL/rest/v1/heartbeat?select=id,beat_at&limit=1" -H "apikey: $SUPABASE_KEY"
          echo
          echo "Supabase answered — project stays awake."
